[package]
name = "aurora"
version = "0.1.0"
edition = "2024"
description = "Data visualization and statistical analysis program written entirely in Rust"

[dependencies]
ndarray = "0.15"
argmin = "0.10"
egui = "0.27"
eframe = "0.27"
plotters = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"

# objc2 0.4.1 (pulled in by winit 0.29 via eframe) aborts on a benign Objective-C
# return-type check ("expected 'q', found 'Q'") when `debug_assertions` are on:
# iterating `NSScreen` panics while winit queries the monitor scale factor, so a
# plain `cargo run` could not open a window. Build that crate without debug
# assertions; everything else keeps them (tests included).
[profile.dev.package.objc2]
debug-assertions = false
